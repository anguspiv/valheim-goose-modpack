name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  thunderstore-zip:
    runs-on: ubuntu-latest
    env:
      TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Build Thunderstore zip (version must match the tag)
        run: python3 scripts/build-thunderstore.py --out dist --expect-version "${GITHUB_REF_NAME#v}"
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
      # Publishes to Thunderstore when the TCLI_AUTH_TOKEN secret exists (a
      # Thunderstore team service-account token). Skipped otherwise, so a fork or
      # a missing token never fails the release.
      - name: Publish to Thunderstore
        if: ${{ env.TCLI_AUTH_TOKEN != '' }}
        run: |
          dotnet tool install --global tcli
          export PATH="$PATH:$HOME/.dotnet/tools"
          tcli publish --config-path thunderstore.toml --file dist/goose_modpack-"${GITHUB_REF_NAME#v}".zip
